<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>セラーウォッチ検出リスト</title>
    <style>
      body {
        font-family: sans-serif;
        width: 320px;
        padding: 12px;
      }
      h1 {
        font-size: 13px;
        margin: 12px 0 8px;
      }
      h1:first-child {
        margin-top: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
        margin-bottom: 8px;
      }
      th,
      td {
        border-bottom: 1px solid #ddd;
        padding: 4px;
        text-align: left;
      }
      button {
        margin-right: 6px;
        margin-bottom: 6px;
        cursor: pointer;
      }
      .settings-row {
        margin-bottom: 8px;
        font-size: 12px;
      }
      input[type="number"] {
        width: 60px;
      }
      .hint {
        font-size: 11px;
        color: #666;
        margin: 0 0 8px;
      }
    </style>
  </head>
  <body>
    <h1>検出済み・追加待ちのセラー</h1>
    <div id="pending-list"></div>
    <div>
      <button id="export-csv">CSVをダウンロード</button>
      <button id="clear-watchlist">追加済みリストをクリア</button>
    </div>

    <h1>判定条件（評価数レンジ）</h1>
    <div class="settings-row">
      最小 <input type="number" id="min-rating" /> 〜 最大
      <input type="number" id="max-rating" />
      <button id="save-settings">保存</button>
    </div>

    <h1>その他</h1>
    <p class="hint">
      検出済み履歴をリセットすると、既に「今回は追加しない」等で無視した
      セラーも次回また判定対象になります。
    </p>
    <button id="reset-seen">検出済みセラー履歴をリセット</button>

    <script src="popup.js"></script>
  </body>
</html>
